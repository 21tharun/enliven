    // 02. Hero Component
    function Hero({ onOpenBooking }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const particles = [];
        for (let i = 0; i < 45; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.2 + 0.5,
            alpha: Math.random() * 0.5 + 0.1,
            speedX: (Math.random() - 0.5) * 0.4,
            speedY: -Math.random() * 0.3 - 0.1
          });
        }

        let animId;
        const animate = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.x += p.speedX; p.y += p.speedY;
            if (p.y < 0) p.y = height;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(243, 229, 171, ${p.alpha})`;
            ctx.fill();
          });
          animId = requestAnimationFrame(animate);
        };
        animate();
        return () => cancelAnimationFrame(animId);
      }, []);

      return (
        <section className="hero-section" id="hero">

            <img src="assets/hero_luxury_villa.png" alt="ENLIVEN ELITE Architecture" />

                    <li><a href="#our-story">Our Story</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#gallery">Gallery</a></li>
                    <li><a href="#services">Services</a></li>
                    <li><a href="#media">Media</a></li>
                    <li><a href="#contact">Contact</a></li>
                  </ul>
                </div>
              </div>

              <div className="footer-bottom">
                <div>© 2026 ENLIVEN ELITE Studio. All Rights Reserved. Bengaluru, Karnataka.</div>
              </div>
            </div>
          </footer>

          {/* Booking Modal */}
          {bookingOpen && (
            <div className="modal-backdrop active" onClick={onCloseBooking}>
              <div className="modal-container" onClick={e => e.stopPropagation()}>
                <button className="modal-close" onClick={onCloseBooking}><i data-lucide="x"></i></button>
                {!submitted ? (
                  <React.Fragment>
                    <div style={{ marginBottom: '28px' }}>
                      <div className="editorial-tag" style={{ marginBottom: '8px' }}>Private Consultation</div>
                      <h2 className="editorial-serif" style={{ fontSize: '2.2rem', color: 'var(--text-main)' }}>Commission Your Space</h2>
                    </div>
                    <form onSubmit={handleSubmit}>
                      <div className="form-group">
                        <label className="form-label">Full Name</label>
                        <input type="text" className="form-input" placeholder="e.g. Vikramaditya Rao" required />
                      </div>
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                        <div className="form-group">
                          <label className="form-label">Phone Number</label>
                          <input type="tel" className="form-input" placeholder="+91 98765 43210" required />
                        </div>
                        <div className="form-group">
                          <label className="form-label">Email Address</label>
                          <input type="email" className="form-input" placeholder="name@domain.com" required />
                        </div>
                      </div>
                      <button type="submit" className="btn-luxury btn-luxury-solid" style={{ width: '100%', justifyContent: 'center', padding: '16px' }}>
                        <span>Request Private Consultation</span>
                        <i data-lucide="arrow-right"></i>
                      </button>
                    </form>
                  </React.Fragment>
                ) : (
                  <div style={{ textAlign: 'center', padding: '40px 20px' }}>
                    <h3 className="editorial-serif" style={{ fontSize: '2.2rem', marginBottom: '12px' }}>Consultation Confirmed</h3>
                    <p style={{ color: 'var(--text-muted)', marginBottom: '24px' }}>Senior Design Partner will contact you within 24 hours.</p>
                    <button className="btn-luxury btn-luxury-solid" onClick={onCloseBooking}><span>Close Window</span></button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Project Modal */}
          {selectedProject && (
            <div className="modal-backdrop active" onClick={onCloseProject}>
              <div className="modal-container" style={{ maxWidth: '840px' }} onClick={e => e.stopPropagation()}>
                <button className="modal-close" onClick={onCloseProject}><i data-lucide="x"></i></button>
                <div style={{ marginBottom: '24px' }}>
                  <span className="project-category">{selectedProject.catName}</span>
                  <h2 className="editorial-serif" style={{ fontSize: '2.6rem', color: 'var(--text-main)' }}>{selectedProject.title}</h2>
                </div>
                <div style={{ height: '400px', borderRadius: 'var(--radius-sm)', overflow: 'hidden', marginBottom: '24px' }}>
                  <img src={selectedProject.img} alt={selectedProject.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '20px', padding: '20px', background: 'var(--bg-dark)', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border-color)' }}>
                  <div><div style={{ fontSize: '0.7rem', textTransform: 'uppercase', color: 'var(--color-teak)' }}>Location</div><div style={{ color: 'var(--text-main)' }}>Sadashivnagar, Bengaluru</div></div>
                  <div><div style={{ fontSize: '0.7rem', textTransform: 'uppercase', color: 'var(--color-teak)' }}>Specifications</div><div style={{ color: 'var(--text-main)' }}>{selectedProject.meta}</div></div>
                  <div><div style={{ fontSize: '0.7rem', textTransform: 'uppercase', color: 'var(--color-teak)' }}>Materials</div><div style={{ color: 'var(--text-main)' }}>Burma Teak & Brass</div></div>
                </div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    // Main App Component
    function App() {
      const [bookingOpen, setBookingOpen] = useState(false);
      const [selectedProject, setSelectedProject] = useState(null);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      return (
        <div className="app-root">
          <Navbar onOpenBooking={() => setBookingOpen(true)} />
          <main>
            <Hero onOpenBooking={() => setBookingOpen(true)} />
            <OurStory />
            <Projects onSelectProject={(p) => setSelectedProject(p)} />
            <Gallery />
            <Services onOpenBooking={() => setBookingOpen(true)} />
            <Media />
          </main>
          <CraftAndFooter 
            bookingOpen={bookingOpen}
            onCloseBooking={() => setBookingOpen(false)}
            onOpenBooking={() => setBookingOpen(true)}
            selectedProject={selectedProject}
            onCloseProject={() => setSelectedProject(null)}
          />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Preloader Control Script -->
  <script>
    (function () {
      var preloader = document.getElementById('site-preloader');
      var logo      = document.getElementById('preloader-logo');
      var brand     = document.getElementById('preloader-brand');
      var line      = document.getElementById('preloader-line');

      // Lock scroll
      document.body.classList.add('preloader-active');

      var dismissed = false;

      function dismissPreloader() {
        if (dismissed) return;
        dismissed = true;
        preloader.classList.add('exit');
        document.body.classList.remove('preloader-active');
        setTimeout(function () {
          if (preloader && preloader.parentNode) preloader.parentNode.removeChild(preloader);
        }, 1050);
      }

      // Step 1: logo rises up after a tiny delay
      setTimeout(function () {
        logo.classList.add('reveal');
        brand.classList.add('reveal');
      }, 200);

      // Step 2: gold line sweeps across
      setTimeout(function () {
        line.classList.add('fill');
      }, 300);

      // Step 3: exit after 2.8s (line completes) + small pause
      setTimeout(dismissPreloader, 3200);
    })();
  </script>
</body>
</html>
